<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Photos | Everything Embroidered</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<style>
  body { background: #F3EEE4; }

  .up-bar { background: var(--navy); color: #fff; padding: 18px 0; text-align: center; }
  .up-bar .name { font-family: 'Fraunces', serif; font-size: 1.3rem; }
  .up-bar .name span { color: var(--thread-gold); }

  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

  h1 { font-size: clamp(2rem, 6vw, 2.8rem); text-align: center; margin-bottom: 10px; }
  .intro { text-align: center; font-size: 1.15rem; color: #4A453C; margin-bottom: 34px; }

  .login {
    max-width: 420px; margin: 0 auto; background: #fff;
    border-radius: 20px; padding: 32px 28px; box-shadow: var(--shadow);
  }
  .login label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 1.05rem; }
  .login input {
    width: 100%; font-size: 1.2rem; padding: 14px 16px;
    border: 2px solid #D9CFBD; border-radius: 12px; margin-bottom: 16px;
    font-family: 'Inter', sans-serif;
  }
  .login input:focus { outline: none; border-color: var(--terracotta); }
  .login .msg { color: #B03A2E; font-weight: 600; min-height: 1.4em; margin: -6px 0 10px; }

  .big-button {
    display: block; width: 100%;
    background: var(--terracotta); color: #fff;
    border: none; border-radius: 20px;
    padding: 30px 24px;
    font-family: 'Inter', sans-serif; font-size: 1.4rem; font-weight: 700;
    cursor: pointer; line-height: 1.3;
    box-shadow: 0 10px 30px rgba(193,97,61,0.32);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .big-button:hover { background: var(--terracotta-dark); }
  .big-button:active { transform: scale(0.985); }
  .big-button:disabled { background: #B5AC9B; box-shadow: none; cursor: default; }
  .big-button .sub { display: block; font-size: 1rem; font-weight: 500; opacity: 0.9; margin-top: 6px; }
  .login .big-button { padding: 18px; font-size: 1.15rem; border-radius: 14px; }

  .bar { display: flex; justify-content: space-between; align-items: baseline; margin: 40px 0 16px; gap: 12px; flex-wrap: wrap; }
  .bar h2 { font-size: 1.5rem; margin: 0; }
  .bar .count { color: #7A7365; }
  .link-btn { background: none; border: none; color: #7A7365; font-size: 0.95rem; cursor: pointer; text-decoration: underline; padding: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .card {
    background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: opacity 0.2s ease;
  }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #E5DDCE; display: block; }
  .card .date { font-size: 0.85rem; color: #7A7365; padding: 10px 12px 0; }
  .card button {
    margin: 10px 12px 12px; padding: 12px; border-radius: 12px;
    border: 2px solid #B03A2E; background: #fff; color: #B03A2E;
    font-weight: 700; font-size: 1rem; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .card button:hover { background: #B03A2E; color: #fff; }
  .card button.confirm { background: #B03A2E; color: #fff; }
  .card.busy { opacity: 0.45; pointer-events: none; }

  .note { background: #fff; border-radius: 14px; padding: 18px 20px; color: #4A453C; text-align: center; }
  .note.err { background: #FFF3F1; border: 2px solid #B03A2E; color: #7A3229; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff; padding: 14px 24px; border-radius: 999px;
    font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .back { display: block; text-align: center; margin-top: 40px; color: #7A7365; font-size: 1rem; }
  .back:hover { color: var(--navy); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="up-bar">
  <div class="name">Everything <span>Embroidered</span></div>
</div>

<div class="wrap">

  <h1>Manage photos</h1>
  <p class="intro">Add new photos or remove old ones from the Our Work page.</p>

  <form class="login" id="login">
    <label for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <div class="msg" id="loginMsg"></div>
    <button class="big-button" id="loginBtn" type="submit">Log in</button>
  </form>

  <div id="panel" hidden>
    <button class="big-button" id="pickBtn">
      📷 Add Photos
      <span class="sub">You can pick more than one</span>
    </button>
    <input type="file" id="picker" accept="image/*" multiple hidden>

    <div class="bar">
      <h2>On the website now</h2>
      <span><span class="count" id="count"></span> &nbsp; <button class="link-btn" id="logout">Log out</button></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="note" id="note" hidden></div>
  </div>

  <a href="index.html" class="back">← Back to the website</a>

</div>

<div class="toast" id="toast"></div>

<script src="gallery-config.js"></script>
<script>
(function () {
  "use strict";

  var cfg = window.GALLERY_CONFIG || {};
  var KEY = "ee_admin_pw";
  var $ = function (id) { return document.getElementById(id); };
  var pw = null;

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove("show"); }, 2800);
  }

  function api(action, extra) {
    var body = { action: action };
    for (var k in extra) body[k] = extra[k];
    return fetch("/api/photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Password": pw || "" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) {
          var err = new Error(data.message || "Something went wrong (" + r.status + ").");
          err.code = data.error || r.status;
          throw err;
        }
        return data;
      });
    });
  }

  function showNote(msg, isErr) {
    var n = $("note");
    n.textContent = msg;
    n.className = "note" + (isErr ? " err" : "");
    n.hidden = false;
  }

  /* ---------- login ---------- */

  function enter() {
    $("login").hidden = true;
    $("panel").hidden = false;
    load();
  }

  function logout() {
    pw = null;
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    $("panel").hidden = true;
    $("login").hidden = false;
    $("pw").value = "";
    $("pw").focus();
  }

  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    pw = $("pw").value;
    $("loginMsg").textContent = "";
    $("loginBtn").disabled = true;
    api("check").then(function () {
      try { sessionStorage.setItem(KEY, pw); } catch (e2) {}
      enter();
    }).catch(function (err) {
      pw = null;
      $("loginMsg").textContent = err.message;
    }).then(function () { $("loginBtn").disabled = false; });
  });

  $("logout").addEventListener("click", logout);

  /* ---------- list + delete ---------- */

  function fmtDate(s) {
    var d = new Date(s);
    return isNaN(d) ? "" : "Added " + d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function load() {
    $("grid").innerHTML = "";
    $("count").textContent = "";
    showNote("Loading photos…");
    api("list").then(function (data) {
      var photos = data.photos || [];
      $("note").hidden = true;
      $("count").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
      if (!photos.length) showNote("No uploaded photos yet. The Our Work page is showing the built-in photos until you add some.");
      photos.forEach(function (p) { $("grid").appendChild(card(p)); });
    }).catch(function (err) {
      if (err.code === "auth") { logout(); $("loginMsg").textContent = "Please log in again."; return; }
      showNote(err.message, true);
    });
  }

  function card(p) {
    var el = document.createElement("div");
    el.className = "card";
    var img = document.createElement("img");
    img.src = p.thumb; img.alt = ""; img.loading = "lazy";
    var date = document.createElement("div");
    date.className = "date"; date.textContent = fmtDate(p.created);
    var btn = document.createElement("button");
    btn.type = "button"; btn.textContent = "Delete";

    var armed = false, timer;
    btn.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        btn.textContent = "Tap again to delete";
        btn.classList.add("confirm");
        timer = setTimeout(function () { armed = false; btn.textContent = "Delete"; btn.classList.remove("confirm"); }, 4000);
        return;
      }
      clearTimeout(timer);
      el.classList.add("busy");
      btn.textContent = "Deleting…";
      api("delete", { id: p.id }).then(function () {
        el.remove();
        var left = $("grid").children.length;
        $("count").textContent = left + (left === 1 ? " photo" : " photos");
        if (!left) showNote("No uploaded photos left. The Our Work page will show the built-in photos.");
        toast("Photo deleted. It may take a minute to disappear from the site.");
      }).catch(function (err) {
        el.classList.remove("busy");
        armed = false; btn.textContent = "Delete"; btn.classList.remove("confirm");
        toast(err.message);
      });
    });

    el.appendChild(img); el.appendChild(date); el.appendChild(btn);
    return el;
  }

  /* ---------- upload (same as upload.html) ---------- */

  var pickBtn = $("pickBtn"), picker = $("picker");
  pickBtn.addEventListener("click", function () { picker.click(); });
  picker.addEventListener("change", function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    picker.value = "";
    if (!files.length) return;
    if (!cfg.cloudName || !cfg.uploadPreset) { toast("Uploads aren't set up in gallery-config.js"); return; }

    pickBtn.disabled = true;
    pickBtn.firstChild.nodeValue = "Adding " + files.length + (files.length === 1 ? " photo…" : " photos…");
    var ok = 0, fail = 0;
    Promise.all(files.map(function (file) {
      var form = new FormData();
      form.append("file", file);
      form.append("upload_preset", cfg.uploadPreset);
      form.append("tags", cfg.tag || "ourwork");
      return fetch("https://api.cloudinary.com/v1_1/" + cfg.cloudName + "/image/upload", { method: "POST", body: form })
        .then(function (r) { if (!r.ok) throw new Error(); ok++; })
        .catch(function () { fail++; });
    })).then(function () {
      pickBtn.disabled = false;
      pickBtn.firstChild.nodeValue = "📷 Add Photos ";
      toast(fail ? ok + " added, " + fail + " didn't upload. Try those again." : (ok === 1 ? "Photo added!" : ok + " photos added!"));
      load();
    });
  });

  /* ---------- start ---------- */

  try { pw = sessionStorage.getItem(KEY); } catch (e) {}
  if (pw) enter(); else $("pw").focus();
})();
</script>

</body>
</html>
